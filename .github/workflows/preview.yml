name: Preview

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Permisos minimos que exige el despliegue oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un preview a la vez por rama: si llegan dos pushes seguidos a la misma
# rama, gana el ultimo. Un grupo global cancelaria el run de `main` (la unica
# rama que publica) en cuanto llegara un push a cualquier otra rama.
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # El lockfile se escribe con npm 11, y Node 22 trae npm 10. Se fija la
      # version para que coincida.
      #
      # Historicamente `npm ci` fallaba aqui porque al lockfile le faltaban
      # @emnapi/core y @emnapi/wasi-threads, dos dependencias transitivas de
      # sharp. Quedo arreglado al regenerarlo, y ahora la instalacion limpia
      # funciona con npm 10 y con npm 11. El respaldo de abajo se conserva
      # igualmente: un preview mirable vale mas que un build bloqueado.
      - name: Fijar la version de npm
        run: npm install -g npm@11

      - name: Diagnostico del entorno
        run: node -v && npm -v && uname -sm

      - name: Instalar dependencias
        shell: bash
        run: |
          set -o pipefail
          if npm ci 2>&1 | tee /tmp/instalacion.log; then
            echo "instalacion limpia correcta"
            exit 0
          fi

          # Sin acceso a los logs del runner, las anotaciones del check-run son
          # el unico canal legible desde fuera. Se emiten las ultimas lineas.
          echo "::warning::la instalacion limpia fallo; se continua con una instalacion normal"
          tail -n 25 /tmp/instalacion.log | while IFS= read -r linea; do
            echo "::error::$linea"
          done

          # Un preview no necesita la garantia de reproducibilidad de una
          # instalacion limpia: mejor publicar algo mirable que bloquearse.
          npm install --no-audit --no-fund

      # La suite corre antes de publicar: un preview roto no aporta nada.
      #
      # `npm test` construye primero, via el script `pretest`: la suite de las
      # cuatro pasadas lee el HTML de `dist/` y sin build no tiene nada que
      # leer. En local pasaba desapercibido porque siempre hay un dist de una
      # ejecucion anterior; en un runner limpio, no.
      #
      # Ese build va sin BASE_PATH, que es justo lo que necesitan los scripts
      # de verificacion de abajo: piden rutas desde la raiz. El build de
      # preview, con /Safetory por delante, se hace despues.
      - run: npm test

      # `motor.ts` y `planos-profundidad.ts` no se pueden ejecutar en Node:
      # necesitan DOM, WebGL, ResizeObserver e IntersectionObserver. Estos dos
      # scripts son el UNICO punto del proyecto donde se comprueba que
      # funcionan, y todos sus modos de fallo son silenciosos: una escena que
      # se congela al volver de otra pestana, unos planos de profundidad en
      # negro porque una textura no resolvio. Ni excepcion, ni test rojo, ni
      # nada en consola.
      #
      - name: Verificacion del motor 3D y de la degradacion
        shell: bash
        run: |
          set -uo pipefail

          # El runner ya trae Chrome: no hace falta descargar un navegador,
          # y por eso la dependencia es `playwright-core` y no `playwright`.
          NAVEGADOR="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$NAVEGADOR" ]; then
            echo "::error::no hay ningun Chrome en el runner: la unica verificacion del motor 3D no se ha ejecutado"
            exit 1
          fi
          export CHROMIUM="$NAVEGADOR"
          echo "navegador: $NAVEGADOR"

          npx astro preview --port 4330 &
          listo=0
          for _ in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:4330/; then listo=1; break; fi
            sleep 1
          done
          if [ "$listo" -ne 1 ]; then
            echo "::error::el servidor de preview no levanto en 40 s"
            exit 1
          fi

          node scripts/verificacion-3d.mjs
          node scripts/verificacion-degradacion.mjs

      - name: Construir el preview
        env:
          SITE_URL: https://abrinay1997-stack.github.io
          BASE_PATH: /Safetory
          PUBLIC_PREVIEW: 'true'
        run: npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  publicar:
    needs: construir
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
